<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Engine Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3498db; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 shadow-lg mb-8">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Task Engine Pro</h1>
            <div id="nav-user" class="hidden flex items-center gap-4">
                <span id="user-display" class="text-sm font-medium bg-indigo-700 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-sm bg-white text-indigo-600 px-3 py-1 rounded hover:bg-indigo-50 font-bold transition">Logout</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 pb-12">
        <!-- Auth Section -->
        <div id="auth-section" class="max-w-md mx-auto">
            <!-- Login -->
            <div id="login-container" class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Login</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Email</label>
                        <input type="email" id="login-email" value="admin@taskengine.com" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
                        <input type="password" id="login-password" value="Friends@123" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <button onclick="login()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transform active:scale-95 transition">Access Dashboard</button>
                    <p class="text-center text-sm text-slate-600 mt-4">
                        Don't have an account? 
                        <button onclick="toggleAuth('register')" class="text-indigo-600 font-bold hover:underline">Create one</button>
                    </p>
                </div>
            </div>

            <!-- Register -->
            <div id="register-container" class="hidden bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Create Account</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Email</label>
                        <input type="email" id="reg-email" placeholder="you@example.com" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Password</label>
                        <input type="password" id="reg-password" placeholder="••••••••" class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>
                    <button onclick="register()" class="w-full bg-slate-800 text-white font-bold py-3 rounded-lg hover:bg-slate-900 transform active:scale-95 transition">Sign Up</button>
                    <p class="text-center text-sm text-slate-600 mt-4">
                        Already have an account? 
                        <button onclick="toggleAuth('login')" class="text-indigo-600 font-bold hover:underline">Login here</button>
                    </p>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden space-y-8">
            <!-- Create Task -->
            <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Add New Task</h2>
                <div class="flex gap-4">
                    <input type="text" id="task-title" placeholder="What needs to be done?" class="flex-1 border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button onclick="createTask()" class="bg-green-600 text-white px-8 font-bold rounded-lg hover:bg-green-700 transition">Add Task</button>
                </div>
            </div>

            <!-- Task List -->
            <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-800">My Tasks</h2>
                    <button onclick="fetchTasks()" class="text-indigo-600 font-bold hover:underline">Refresh List</button>
                </div>
                <div id="task-list" class="space-y-4">
                    <div class="text-center py-8 text-slate-400">No tasks found. Create one above!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api/v1";

        window.onload = () => {
            const token = localStorage.getItem("token");
            if (token) {
                showDashboard();
                fetchTasks();
            }
        };

        async function register() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            
            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'Registration failed');
                alert('Account created! You can now login.');
            } catch (e) { alert(e.message); }
        }

        async function login() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const formData = new FormData();
            formData.append('username', email);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_BASE}/auth/login`, { method: 'POST', body: formData });
                const data = await res.json();
                if (!res.ok) throw new Error('Invalid credentials');
                localStorage.setItem("token", data.access_token);
                localStorage.setItem("user_email", email);
                showDashboard();
                fetchTasks();
            } catch (e) { alert(e.message); }
        }

        async function fetchTasks() {
            const token = localStorage.getItem("token");
            const list = document.getElementById('task-list');
            list.innerHTML = '<div class="flex justify-center"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8"></div></div>';

            try {
                const res = await fetch(`${API_BASE}/tasks/`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 401) return logout();
                const tasks = await res.json();
                
                list.innerHTML = tasks.length ? '' : '<div class="text-center py-8 text-slate-400">No tasks found.</div>';
                tasks.forEach(task => {
                    const div = document.createElement('div');
                    div.className = "flex items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-lg group hover:border-indigo-300 transition";
                    div.innerHTML = `
                        <span class="font-medium text-slate-700">${task.title}</span>
                        <div class="flex gap-2">
                            <button onclick="deleteTask('${task.id}')" class="text-red-500 hover:text-red-700 opacity-0 group-hover:opacity-100 transition font-bold text-sm">Delete</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) { list.innerHTML = `<div class="text-red-500">${e.message}</div>`; }
        }

        async function createTask() {
            const title = document.getElementById('task-title').value;
            if (!title) return;
            const token = localStorage.getItem("token");
            try {
                const res = await fetch(`${API_BASE}/tasks/`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, description: "" })
                });
                if (!res.ok) throw new Error('Failed to create task');
                document.getElementById('task-title').value = '';
                fetchTasks();
            } catch (e) { alert(e.message); }
        }

        async function deleteTask(id) {
            if (!confirm('Are you sure?')) return;
            const token = localStorage.getItem("token");
            try {
                await fetch(`${API_BASE}/tasks/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                fetchTasks();
            } catch (e) { alert(e.message); }
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('nav-user').classList.remove('hidden');
            document.getElementById('user-display').innerText = localStorage.getItem("user_email");
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function toggleAuth(mode) {
            const loginCont = document.getElementById('login-container');
            const regCont = document.getElementById('register-container');
            if (mode === 'register') {
                loginCont.classList.add('hidden');
                regCont.classList.remove('hidden');
            } else {
                loginCont.classList.remove('hidden');
                regCont.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
